# Application stack: api + web (+ mobile via profile).
#
# Includes the infrastructure stack (Postgres + Redis) from infra/, so a single
# command from the repo root brings up everything:
#
#   pnpm docker:up
#   (= docker compose --env-file .env up --build)
#
# All configuration comes from the single root `.env` (copy from `.env.example`).
# There are NO hard-coded config values here — every value is a ${VAR} reference.
name: carpool

include:
  - infra/docker-compose.infra.yml

services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: ${API_PORT}
      # Container-side URL (host = the 'postgres' service). Defined in root .env.
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      # Required; compose fails fast with this message if it is unset in .env.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?missing in root .env — copy .env.example to .env and set a 32+ char secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      # Google OAuth (web redirect). Optional — empty unless set in root .env.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      EMAIL_FROM: ${EMAIL_FROM}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      # SMTP transport. Optional — empty SMTP_HOST falls back to the console stub.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE}
      SMS_FROM: ${SMS_FROM}
      # Self-hosted SMS gateway. Optional — empty URL falls back to the console stub.
      # NOTE: the container reaches the phone over the LAN; a host like
      # http://192.168.1.x:8080 works, but http://localhost would point at the
      # container itself, not your machine.
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL}
      SMS_GATEWAY_USER: ${SMS_GATEWAY_USER}
      SMS_GATEWAY_PASSWORD: ${SMS_GATEWAY_PASSWORD}
      # Object storage. The container talks to MinIO by service name, but signs
      # presigned URLs with the PUBLIC endpoint — the client follows those and
      # cannot resolve `minio`. Same host/container split as DATABASE_URL.
      S3_ENDPOINT: ${DOCKER_S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_URL_TTL: ${S3_URL_TTL}
    ports:
      - '${API_PORT}:${API_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        # Inlined into the browser bundle at build time (from root .env).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - '${WEB_PORT}:3000'
    depends_on:
      - api

  # Provided for completeness — see infra/Dockerfile.mobile for caveats.
  # Run with:  pnpm docker:up --profile mobile
  mobile:
    build:
      context: .
      dockerfile: infra/Dockerfile.mobile
    profiles: ['mobile']
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
    ports:
      - '${EXPO_PORT}:8081'
    depends_on:
      - api
