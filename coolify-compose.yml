# Coolify Docker Compose build pack. Traefik (Coolify proxy) routes TLS.
# No host ports. No Caddy. Builds run on the server from the repo Dockerfiles.
#
# Assign domains in Coolify; magic vars below tell Traefik which container
# port to use: web:3000, api:3001, minio:9000.
name: carpool

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-api-build: &api-build
  context: .
  dockerfile: Dockerfile

x-api-environment: &api-environment
  PORT: ${PORT}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  EMAIL_FROM: ${EMAIL_FROM}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_SECURE: ${SMTP_SECURE}
  SMS_FROM: ${SMS_FROM}
  SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
  SMS_GATEWAY_USER: ${SMS_GATEWAY_USER:-}
  SMS_GATEWAY_PASSWORD: ${SMS_GATEWAY_PASSWORD:-}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  S3_URL_TTL: ${S3_URL_TTL}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
  PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
  PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
  PAYPAL_MODE: ${PAYPAL_MODE}
  INVOICE_LEGAL_NAME: ${INVOICE_LEGAL_NAME}
  INVOICE_ADDRESS: ${INVOICE_ADDRESS:-}
  INVOICE_GST_NUMBER: ${INVOICE_GST_NUMBER:-}
  INVOICE_QST_NUMBER: ${INVOICE_QST_NUMBER:-}
  TAX_MODE: ${TAX_MODE}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
  NTFY_URL: ${NTFY_URL:-}
  NTFY_TOPIC: ${NTFY_TOPIC:-}
  NTFY_TOKEN: ${NTFY_TOKEN:-}
  PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 2g
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 200mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    command: server /data --console-address ":9001"
    environment:
      SERVICE_FQDN_MINIO_9000: ${SERVICE_FQDN_MINIO_9000}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${S3_CORS_ALLOW_ORIGIN}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-10-13T13-34-11Z
    restart: 'no'
    logging: *default-logging
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
    entrypoint: ['mc']
    command: ['mb', '--ignore-existing', 'local/${S3_BUCKET}']
    depends_on:
      minio:
        condition: service_healthy

  api-migrate:
    build: *api-build
    command: ['node', 'dist/migrate.js']
    restart: 'no'
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *api-build
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      <<: *api-environment
      SERVICE_FQDN_API_3001: ${SERVICE_FQDN_API_3001}
      PAYMENT_WORKER_EMBEDDED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  payment-worker:
    build: *api-build
    command: ['node', 'dist/payment-worker.js']
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    environment:
      SERVICE_FQDN_WEB_3000: ${SERVICE_FQDN_WEB_3000}
      INTERNAL_API_URL: ${INTERNAL_API_URL}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
