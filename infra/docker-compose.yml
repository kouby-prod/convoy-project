# Local orchestration for the carpool skeleton.
# Run from the repo root:  docker compose -f infra/docker-compose.yml up --build
name: carpool

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: carpool
      POSTGRES_PASSWORD: carpool
      POSTGRES_DB: carpool
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carpool -d carpool']
      interval: 5s
      timeout: 5s
      retries: 10

  # Infra provisioned for the future. NOT wired into the app yet.
  # TODO: caching / rate limiting / queues will use this. Out of scope for now.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://carpool:carpool@postgres:5432/carpool
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        # Browser talks to the API on the host-published port.
        NEXT_PUBLIC_API_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - api

  # Provided for completeness — see infra/Dockerfile.mobile for caveats.
  # Run with:  docker compose -f infra/docker-compose.yml --profile mobile up
  mobile:
    build:
      context: ..
      dockerfile: infra/Dockerfile.mobile
    profiles: ['mobile']
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '8081:8081'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
